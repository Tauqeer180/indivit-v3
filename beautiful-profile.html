<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div
      style="
        max-width: 550px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 0;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        background: linear-gradient(135deg, rgba(44,62,80,0.5), rgba(52,73,94,0.9)), 
                    url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=400&fit=crop') center/cover;
        color: white;
      "
    >
      <div style="padding: 30px 25px;">
        <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
          <img
            src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face"
            alt="Profile Picture"
            style="
              width: 100px;
              height: 100px;
              border-radius: 50%;
              object-fit: cover;
              border: 3px solid rgba(255,255,255,0.3);
              box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            "
          />

          <div style="flex: 1; min-width: 250px">
            <h1
              style="
                font-size: 24px;
                font-weight: 300;
                margin: 0 0 5px 0;
                text-shadow: 0 2px 4px rgba(0,0,0,0.3);
              "
            >
              John Doe
            </h1>
            <p style="font-size: 16px; color: rgba(255,255,255,0.8); margin: 0 0 15px 0; font-weight: 300;">
              Senior Software Engineer
            </p>
            <div style="font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.9);">
              <p style="margin: 0 0 5px 0;">🏢 Company Name Inc.</p>
              <p style="margin: 0 0 5px 0;">📱 +1 (555) 123-4567</p>
              <p style="margin: 0 0 5px 0;">📧 john.doe@company.com</p>
              <p style="margin: 0 0 15px 0;">🌐 www.company.com</p>
              <div style="display: flex; gap: 15px;">
                <a href="https://linkedin.com" style="opacity: 0.8; transition: opacity 0.3s;">
                  <img
                    src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/linkedin.svg"
                    alt="LinkedIn"
                    style="width: 24px; height: 24px; filter: invert(1);"
                /></a>
                <a href="https://twitter.com" style="opacity: 0.8; transition: opacity 0.3s;">
                  <img
                    src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/twitter.svg"
                    alt="Twitter"
                    style="width: 24px; height: 24px; filter: invert(1);"
                /></a>
                <a href="https://github.com" style="opacity: 0.8; transition: opacity 0.3s;">
                  <img
                    src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg"
                    alt="GitHub"
                    style="width: 24px; height: 24px; filter: invert(1);"
                /></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
