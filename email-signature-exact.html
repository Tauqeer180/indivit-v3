<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        width: 100%;
        max-width: 593px;
        background: linear-gradient(135deg, #f5f5f5 0%, #5865f2 100%);
        border-radius: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      "
    >
      <tr>
        <td style="padding: 24px">
          <table cellpadding="0" cellspacing="0" border="0" width="100%">
            <tr>
              <!-- Left Column -->
              <td style="vertical-align: top; width: 33%">
                <h1
                  style="
                    font-size: 28px;
                    font-weight: 600;
                    color: #5865f2;
                    margin: 0 0 6px 0;
                    line-height: 1.1;
                  "
                >
                  James Doe
                </h1>

                <p style="font-size: 16px; color: #a0a0a0; margin: 0 0 20px 0; font-weight: 400">
                  Software Engineer
                </p>

                <!-- Social Icons -->
                <div style="margin-bottom: 24px">
                  <a
                    href="#"
                    style="
                      display: inline-block;
                      width: 30px;
                      height: 30px;
                      background: #0077b5;
                      border-radius: 8px;
                      margin-right: 8px;
                      text-align: center;
                      line-height: 36px;
                      text-decoration: none;
                    "
                  >
                    <span style="color: white; font-weight: bold; font-size: 16px">in</span>
                  </a>
                  <a
                    href="#"
                    style="
                      display: inline-block;
                      width: 30px;
                      height: 30px;
                      background: #7289da;
                      border-radius: 8px;
                      margin-right: 8px;
                      text-align: center;
                      line-height: 36px;
                      text-decoration: none;
                    "
                  >
                    <span style="color: white; font-weight: bold; font-size: 16px">M</span>
                  </a>
                  <a
                    href="#"
                    style="
                      display: inline-block;
                      width: 30px;
                      height: 30px;
                      background: #1da1f2;
                      border-radius: 8px;
                      margin-right: 8px;
                      text-align: center;
                      line-height: 36px;
                      text-decoration: none;
                    "
                  >
                    <span style="color: white; font-weight: bold; font-size: 16px">t</span>
                  </a>
                  <a
                    href="#"
                    style="
                      display: inline-block;
                      width: 30px;
                      height: 30px;
                      background: #5865f2;
                      border-radius: 8px;
                      text-align: center;
                      line-height: 36px;
                      text-decoration: none;
                    "
                  >
                    <span style="color: white; font-weight: bold; font-size: 16px">W</span>
                  </a>
                </div>

                <!-- Company Logo -->
                <div
                  style="color: #5865f2; font-size: 32px; font-weight: 700; letter-spacing: -1px"
                >
                  core
                </div>
              </td>

              <td style="vertical-align: center; width: 33%; text-align: center">
                <div
                  style="
                    width: 100px;
                    height: 100px;
                    border-radius: 50%;
                    background: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=face')
                      center/cover;
                    border: 4px solid rgba(255, 255, 255, 0.3);
                    margin: 0 0 20px 0;
                    display: inline-block;
                  "
                ></div>
              </td>
              <!-- Right Column -->
              <td style="vertical-align: center; width: 34%">
                <!-- Profile Image -->

                <!-- Contact Info -->
                <div style="color: white; font-size: 14px; line-height: 1.8">
                  <div style="margin-bottom: 6px">📧 James@core.com</div>
                  <div style="margin-bottom: 6px">📱 +(91) 9865456739</div>
                  <div style="margin-bottom: 6px">🌐 www.core.com</div>
                  <div>
                    📍 Office 50, Calicut<br />
                    &nbsp;&nbsp;&nbsp;&nbsp;Kerala, India
                  </div>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <!-- Mobile Responsive -->
    <style>
      @media (max-width: 600px) {
        table[style*='max-width: 500px'] {
          max-width: 100% !important;
        }
        td[style*='width: 60%'],
        td[style*='width: 40%'] {
          display: block !important;
          width: 100% !important;
          text-align: center !important;
        }
        div[style*='text-align: right'] {
          text-align: center !important;
        }
        div[style*='margin: 0 0 20px 0'] {
          margin: 0 auto 20px auto !important;
        }
      }
    </style>
  </body>
</html>
